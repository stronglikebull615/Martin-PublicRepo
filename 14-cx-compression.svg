<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="980" height="204" viewBox="0 0 980 204" aria-label="A programme bar divided into design, procurement, construction and commissioning, with three upstream delay arrows pushing from the left to compress the commissioning block against a fixed energization line at the right." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dce7df"></path></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fa398"></path></marker></defs><title>Upstream delay compresses the commissioning window</title>
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#dce7df" font-weight="600" x="16" y="34">THE PROGRAMME · FIXED END DATE</text>

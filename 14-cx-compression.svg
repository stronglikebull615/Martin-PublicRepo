        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="667" y="151" text-anchor="middle">CONSTRUCTION</text>
        <rect fill="#123521" stroke="#3dcd58" stroke-width="2" x="814" y="118" width="120" height="56" rx="3"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#3dcd58" font-weight="600" x="874" y="151" text-anchor="middle">Cx</text>

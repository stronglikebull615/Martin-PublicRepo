<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="1006" height="320" viewBox="-46 0 1006 320" aria-label="Density ladder showing kilowatts per rack from 3 to over 130, mapped against viable cooling technologies from raised floor air through containment, rear door heat exchangers, and direct-to-chip liquid cooling."><defs></defs><title>Cooling technology by rack density</title>
        
        <line stroke="#dce7df" fill="none" x1="120" y1="272" x2="900" y2="272" stroke-width="1.4"></line>
        <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" text-anchor="middle">
          <text x="140" y="292">3 kW</text>
          <text x="270" y="292">10 kW</text>
          <text x="410" y="292">20 kW</text>
          <text x="550" y="292">40 kW</text>
          <text x="700" y="292">80 kW</text>
          <text x="860" y="292">130 kW+</text>
        </g>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="510" y="312" text-anchor="middle">PER-RACK POWER DENSITY →</text>
        <g stroke="#3f5c4b" fill="none" stroke-width="1" stroke-dasharray="3 4">
          <line x1="140" y1="52" x2="140" y2="268"></line><line x1="270" y1="52" x2="270" y2="268"></line>
          <line x1="410" y1="52" x2="410" y2="268"></line><line x1="550" y1="52" x2="550" y2="268"></line>
          <line x1="700" y1="52" x2="700" y2="268"></line><line x1="860" y1="52" x2="860" y2="268"></line>
        </g>

        
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="112" y="72" text-anchor="end">Raised floor air</text>
        <rect fill="#12241a" stroke="#3f5c4b" x="120" y="60" width="180" height="20" rx="2" stroke-width="1"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="310" y="74">runs out fast</text>

        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="112" y="110" text-anchor="end">Containment + CRAH</text>
        <rect fill="#12241a" stroke="#3f5c4b" x="120" y="98" width="340" height="20" rx="2" stroke-width="1"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="470" y="112">the practical ceiling for air, ~20–25 kW</text>

        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#4fc7d4" x="112" y="148" text-anchor="end">Rear-door HX</text>
        <rect fill="#0f2b31" stroke="#4fc7d4" stroke-width="1.3" x="330" y="136" width="290" height="20" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="630" y="150">retrofits into existing halls — no server change</text>

        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#4fc7d4" x="112" y="186" text-anchor="end">Direct-to-chip</text>
        <rect fill="#0f2b31" stroke="#4fc7d4" stroke-width="1.3" x="470" y="174" width="420" height="20" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#4fc7d4" x="480" y="188">cold plate + CDU · the AI default</text>

        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="112" y="224" text-anchor="end">Immersion</text>
        <rect stroke="#3f5c4b" x="640" y="212" width="250" height="20" rx="2" fill="none" stroke-width="1.2" stroke-dasharray="4 3"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="650" y="226">niche at Equinix today — know it, don't lead with it</text>

        
        <line stroke="#3dcd58" x1="410" y1="44" x2="410" y2="272" stroke-width="1.6"></line>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#3dcd58" font-weight="500" x="404" y="38" text-anchor="end">AIR GIVES UP HERE</text>
        <line stroke="#3dcd58" x1="700" y1="44" x2="700" y2="272" stroke-width="1.6" stroke-dasharray="5 3"></line>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#3dcd58" font-weight="500" x="708" y="38">AI TRAINING RACKS LIVE HERE</text>
      </svg>
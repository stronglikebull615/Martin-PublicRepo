        <rect fill="#123521" stroke="#3dcd58" stroke-width="1.3" x="118" y="52" width="46" height="30"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#3dcd58" font-weight="600" x="141" y="72" text-anchor="middle">UPS</text>

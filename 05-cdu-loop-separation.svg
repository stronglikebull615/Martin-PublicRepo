<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="900" height="296" viewBox="0 0 900 296" aria-label="Diagram of a coolant distribution unit sitting between the facility water loop and the technology cooling system loop, showing that heat passes between the two loops while the fluids never mix."><defs><marker id="a-12707F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fc7d4"></path></marker></defs><title>CDU loop separation: heat crosses, fluid does not</title>
        

        
        <rect fill="none" stroke="#3f5c4b" stroke-width="1.2" stroke-dasharray="4 3" x="16" y="58" width="196" height="186" rx="3"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="114" y="84" text-anchor="middle">FACILITY WATER</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="114" y="99" text-anchor="middle">the building loop · FWS</text>
        <line stroke="#3f5c4b" fill="none" x1="34" y1="112" x2="194" y2="112" stroke-width="1"></line>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="34" y="134">serves the whole building</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="34" y="152">building-grade water</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="34" y="170">whatever pressure the</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="34" y="184">plant happens to run</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="34" y="206">if it leaks: a wet floor</text>

        
        <rect fill="#0f2b31" stroke="#4fc7d4" stroke-width="1.3" x="266" y="34" width="286" height="228" rx="3"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#4fc7d4" font-weight="600" x="409" y="60" text-anchor="middle">CDU</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="409" y="76" text-anchor="middle">coolant distribution unit</text>

        
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="336" y="100" text-anchor="middle">facility side</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="482" y="100" text-anchor="middle">chip side</text>
        <line stroke="#dce7df" fill="none" x1="409" y1="110" x2="409" y2="238" stroke-width="3"></line>

        
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#4fc7d4" font-weight="500" x="482" y="144" text-anchor="middle">HEAT</text>
        <line stroke="#4fc7d4" fill="none" x1="486" y1="160" x2="336" y2="160" stroke-width="2.6" marker-end="url(#a-12707F)"></line>

        
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="482" y="196" text-anchor="middle">FLUID</text>
        <line stroke="#3f5c4b" fill="none" x1="486" y1="212" x2="440" y2="212" stroke-width="2"></line>
        <line stroke="#3f5c4b" fill="none" x1="378" y1="212" x2="336" y2="212" stroke-width="2"></line>
        <circle stroke="#dce7df" fill="none" cx="409" cy="212" r="13" stroke-width="2.2"></circle>
        <line stroke="#dce7df" fill="none" x1="400" y1="203" x2="418" y2="221" stroke-width="2.2"></line>

        
        <rect fill="#0f2b31" stroke="#4fc7d4" stroke-width="1.3" x="606" y="58" width="278" height="186" rx="3"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#4fc7d4" font-weight="600" x="745" y="84" text-anchor="middle">TECHNOLOGY COOLING</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="745" y="99" text-anchor="middle">the clean chip loop · TCS</text>
        <line stroke="#3f5c4b" fill="none" x1="624" y1="112" x2="866" y2="112" stroke-width="1"></line>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="624" y="134">into cold plates on the processors</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="624" y="152">filtered and chemically treated</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="624" y="170">low, tightly regulated pressure</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="624" y="188">held above dew point — or it condenses</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#4fc7d4" x="624" y="210">if it leaks: dead GPUs</text>

        
        <line stroke="#3f5c4b" fill="none" x1="212" y1="148" x2="262" y2="148" stroke-width="2"></line>
        <line stroke="#3f5c4b" fill="none" x1="556" y1="148" x2="602" y2="148" stroke-width="2"></line>

        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="409" y="282" text-anchor="middle">Heat crosses. Fluid never does.</text>
      </svg>
<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="994" height="260" viewBox="-54 0 994 260" aria-label="Timeline showing equipment lead times measured backwards from energization date, with transformers requiring the earliest order and the design freeze date preceding all orders."><defs></defs><title>Equipment lead times read back from energisation</title>
        
        <line stroke="#dce7df" fill="none" x1="60" y1="212" x2="880" y2="212" stroke-width="1.4"></line>
        <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" text-anchor="middle">
          <text x="90" y="232">T−30 mo</text><text x="270" y="232">T−24</text>
          <text x="450" y="232">T−18</text><text x="630" y="232">T−12</text>
          <text x="810" y="232">T−6</text>
        </g>
        <circle fill="#3dcd58" cx="880" cy="212" r="5"></circle>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#3dcd58" font-weight="600" x="880" y="248" text-anchor="middle">ENERGIZE</text>

        
        <line stroke="#3dcd58" x1="150" y1="34" x2="150" y2="212" stroke-width="1.8"></line>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#3dcd58" font-weight="500" x="158" y="30">ELECTRICAL ARCHITECTURE FROZEN</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="158" y="44">everything to the right depends on this</text>

        
        <g>
          <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="52" y="72" text-anchor="end">Transformers</text>
          <rect fill="#123521" stroke="#3dcd58" stroke-width="1.3" x="180" y="61" width="700" height="15" rx="2"></rect>
          <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="188" y="73">60–120 weeks — the longest pole on the job</text>

          <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="52" y="98" text-anchor="end">Generators</text>
          <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="300" y="87" width="580" height="15" rx="2"></rect>
          <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="308" y="99">50–80 weeks</text>

          <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="52" y="124" text-anchor="end">MV switchgear</text>
          <rect fill="#123521" stroke="#3dcd58" stroke-width="1.3" x="360" y="113" width="520" height="15" rx="2"></rect>
          <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="368" y="125">40–60 weeks</text>

          <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="52" y="150" text-anchor="end">Chillers / CDU</text>
          <rect fill="#0f2b31" stroke="#4fc7d4" stroke-width="1.3" x="400" y="139" width="480" height="15" rx="2"></rect>
          <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="408" y="151">40–60 weeks</text>

          <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="52" y="176" text-anchor="end">UPS + LV gear</text>
          <rect fill="#123521" stroke="#3dcd58" stroke-width="1.3" x="470" y="165" width="410" height="15" rx="2"></rect>
          <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="478" y="177">30–50 weeks</text>
        </g>

        
        <g stroke="#3dcd58" fill="none" stroke-width="1" stroke-dasharray="2 3">
          <line x1="180" y1="76" x2="180" y2="206"></line>
        </g>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#3dcd58" font-weight="500" x="186" y="200">first order goes here</text>
      </svg>
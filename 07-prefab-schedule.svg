<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" aria-label="Comparison of stick-built and prefabricated construction schedules, showing prefab moving equipment assembly and testing off the critical path into the factory in parallel with site works."><defs><marker id="a-141A1D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dce7df"></path></marker><marker id="a-A65F0B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3dcd58"></path></marker></defs><title>Prefabrication moves the factory off the critical path</title>
        
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#dce7df" font-weight="600" x="16" y="22">STICK-BUILT — everything happens on site, in sequence</text>
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="16" y="34" width="150" height="26" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="91" y="51" text-anchor="middle">site works</text>
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="170" y="34" width="180" height="26" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="260" y="51" text-anchor="middle">install equipment</text>
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="354" y="34" width="150" height="26" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="429" y="51" text-anchor="middle">wire + terminate</text>
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="508" y="34" width="170" height="26" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="593" y="51" text-anchor="middle">commission on site</text>
        <line stroke="#dce7df" fill="none" x1="678" y1="47" x2="716" y2="47" stroke-width="1.6" marker-end="url(#a-141A1D)"></line>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="724" y="51">energize</text>

        <line stroke="#3f5c4b" fill="none" x1="16" y1="86" x2="884" y2="86" stroke-width="1"></line>

        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#3dcd58" font-weight="600" x="16" y="112">PREFABRICATED — the factory runs in parallel</text>
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="16" y="124" width="150" height="26" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="91" y="141" text-anchor="middle">site works</text>
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="170" y="124" width="120" height="26" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="230" y="141" text-anchor="middle">set + connect</text>
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="294" y="124" width="96" height="26" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="342" y="141" text-anchor="middle">verify</text>
        <line stroke="#3dcd58" fill="none" x1="390" y1="137" x2="428" y2="137" stroke-width="1.6" marker-end="url(#a-A65F0B)"></line>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#3dcd58" font-weight="600" x="436" y="141">energize</text>

        
        <rect fill="#123521" stroke="#3dcd58" stroke-width="1.3" x="16" y="164" width="274" height="26" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#3dcd58" x="153" y="181" text-anchor="middle">FACTORY: build + fully test the skid</text>
        <path stroke="#3dcd58" fill="none" d="M290 177 L316 177 L316 152" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a-A65F0B)"></path>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="16" y="208">off the critical path · witnessed factory acceptance test replaces most on-site commissioning</text>

        
        <path stroke="#3dcd58" fill="none" d="M436 96 L716 96" stroke-width="1.2"></path>
        <path stroke="#3dcd58" fill="none" d="M436 92 L436 100 M716 92 L716 100" stroke-width="1.2"></path>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#3dcd58" font-weight="500" x="576" y="88" text-anchor="middle">SCHEDULE RECOVERED</text>
      </svg>
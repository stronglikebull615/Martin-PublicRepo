<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="980" height="212" viewBox="0 0 980 212" aria-label="The five commissioning levels as a ladder from L1 factory testing through L5 integrated systems test, with a divider separating factory work from site work and L1 marked as the only level the supplier fully controls." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dce7df"></path></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fa398"></path></marker></defs><title>The five levels of commissioning</title>
        <rect fill="#123521" stroke="#3dcd58" x="16" y="60" width="176" height="112" rx="3" stroke-width="1.4"></rect>
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#3dcd58" font-weight="600" x="104" y="46" text-anchor="middle">FACTORY</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="500" y="46" text-anchor="middle">SITE</text>
        <line stroke="#dce7df" x1="208" y1="30" x2="208" y2="200" stroke-width="1.4" stroke-dasharray="5 4"></line>
        <rect fill="#123521" stroke="#3dcd58" stroke-width="1.3" x="16" y="76" width="176" height="80" rx="3"></rect>
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="19" fill="#3dcd58" font-weight="700" x="32" y="104">L1</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#3dcd58" font-weight="600" x="32" y="124">FACTORY TEST</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="32" y="140">built + witnessed</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="32" y="152">before it ships</text>
        <line stroke="#dce7df" fill="none" stroke-width="1.5" x1="192" y1="116" x2="208" y2="116" marker-end="url(#ar)"></line>
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="212" y="76" width="176" height="80" rx="3"></rect>
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="19" fill="#dce7df" font-weight="700" x="228" y="104">L2</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#dce7df" font-weight="600" x="228" y="124">DELIVERY</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="228" y="140">static checks</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="228" y="152">nothing energized</text>
        <line stroke="#dce7df" fill="none" stroke-width="1.5" x1="388" y1="116" x2="404" y2="116" marker-end="url(#ar)"></line>
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="408" y="76" width="176" height="80" rx="3"></rect>
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="19" fill="#dce7df" font-weight="700" x="424" y="104">L3</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#dce7df" font-weight="600" x="424" y="124">FUNCTIONAL</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="424" y="140">each system alone</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="424" y="152">first energization</text>
        <line stroke="#dce7df" fill="none" stroke-width="1.5" x1="584" y1="116" x2="600" y2="116" marker-end="url(#ar)"></line>
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="604" y="76" width="176" height="80" rx="3"></rect>
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="19" fill="#dce7df" font-weight="700" x="620" y="104">L4</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#dce7df" font-weight="600" x="620" y="124">INTEGRATED</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="620" y="140">within a discipline</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="620" y="152">the train transfers</text>
        <line stroke="#dce7df" fill="none" stroke-width="1.5" x1="780" y1="116" x2="796" y2="116" marker-end="url(#ar)"></line>
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="2" x="800" y="76" width="176" height="80" rx="3"></rect>
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="19" fill="#dce7df" font-weight="700" x="816" y="104">L5</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#dce7df" font-weight="600" x="816" y="124">SYSTEMS TEST</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="816" y="140">whole facility</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="816" y="152">under load bank</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#3dcd58" x="16" y="192">the only level you fully control</text>
        <line stroke="#3dcd58" fill="none" stroke-width="1.1" x1="16" y1="178" x2="192" y2="178"></line>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="964" y="192" text-anchor="end">reputation event — everyone in the room</text>
        <line stroke="#3f5c4b" fill="none" stroke-width="1.1" x1="800" y1="178" x2="964" y2="178"></line>
</svg>
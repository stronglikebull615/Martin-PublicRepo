<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="412" viewBox="0 0 1000 412" aria-label="Cooling diagram showing the air path from server through hot aisle containment to CRAH, and the liquid path from chip cold plate through manifold and CDU to facility water, both rejecting heat to the chilled water plant."><defs><marker id="a-12707F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fc7d4"></path></marker><marker id="a-141A1D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dce7df"></path></marker></defs><title>Air and liquid cooling paths</title>
        

        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#dce7df" font-weight="600" x="234" y="22" text-anchor="middle">AIR PATH — legacy, and still most of the estate</text>

        
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="30" y="44" width="104" height="120" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="82" y="88" text-anchor="middle">SERVER</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="82" y="112" text-anchor="middle">fans and</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="82" y="126" text-anchor="middle">heatsinks</text>

        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="166" y="44" width="120" height="120" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="226" y="82" text-anchor="middle">HOT AISLE</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="226" y="97" text-anchor="middle">CONTAINMENT</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="226" y="120" text-anchor="middle">stops hot and cold</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="226" y="134" text-anchor="middle">air from mixing</text>

        <rect fill="#0f2b31" stroke="#4fc7d4" stroke-width="1.3" x="318" y="44" width="120" height="120" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#4fc7d4" font-weight="600" x="378" y="82" text-anchor="middle">CRAH</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#4fc7d4" font-weight="600" x="378" y="97" text-anchor="middle">or FAN WALL</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="378" y="120" text-anchor="middle">air-to-water</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="378" y="134" text-anchor="middle">heat exchanger</text>

        <g stroke="#4fc7d4" fill="none" stroke-width="1.8">
          <line x1="134" y1="104" x2="160" y2="104" marker-end="url(#a-141A1D)"></line>
          <line x1="286" y1="104" x2="312" y2="104" marker-end="url(#a-141A1D)"></line>
          <line x1="438" y1="104" x2="480" y2="104" marker-end="url(#a-141A1D)"></line>
        </g>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="226" y="38" text-anchor="middle">hot aisle air ~35°C</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#4fc7d4" font-weight="500" x="455" y="96" text-anchor="middle">to plant</text>

        <path stroke="#4fc7d4" fill="none" d="M378 164 L378 186 L82 186 L82 164" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a-12707F)"></path>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="230" y="180" text-anchor="middle">cold air returned to the cold aisle · ~22°C</text>

        <line stroke="#3f5c4b" fill="none" x1="20" y1="204" x2="980" y2="204" stroke-width="1"></line>
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#4fc7d4" font-weight="600" x="234" y="228" text-anchor="middle">LIQUID PATH — direct-to-chip</text>

        
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="30" y="244" width="104" height="120" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="82" y="284" text-anchor="middle">CHIP</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#4fc7d4" font-weight="600" x="82" y="299" text-anchor="middle">COLD PLATE</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="82" y="322" text-anchor="middle">liquid on the</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="82" y="336" text-anchor="middle">processor lid</text>

        <rect fill="#0f2b31" stroke="#4fc7d4" stroke-width="1.3" x="166" y="244" width="120" height="120" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#4fc7d4" font-weight="600" x="226" y="292" text-anchor="middle">MANIFOLD</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="226" y="315" text-anchor="middle">in-rack splitter</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="226" y="329" text-anchor="middle">and disconnects</text>

        <rect fill="#0f2b31" stroke="#4fc7d4" stroke-width="1.3" x="318" y="244" width="120" height="120" rx="2"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#4fc7d4" font-weight="600" x="378" y="286" text-anchor="middle">CDU</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="378" y="309" text-anchor="middle">pumps and heat</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="378" y="323" text-anchor="middle">exchanger — keeps</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="378" y="337" text-anchor="middle">the loops apart</text>

        <g stroke="#4fc7d4" fill="none" stroke-width="2.4">
          <line x1="134" y1="304" x2="160" y2="304" marker-end="url(#a-141A1D)"></line>
          <line x1="286" y1="304" x2="312" y2="304" marker-end="url(#a-141A1D)"></line>
          <line x1="438" y1="304" x2="480" y2="304" marker-end="url(#a-141A1D)"></line>
        </g>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#4fc7d4" font-weight="500" x="459" y="296" text-anchor="middle">FWS</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#4fc7d4" font-weight="500" x="234" y="384" text-anchor="middle">TCS — technology cooling system, the clean loop</text>
        <line stroke="#4fc7d4" fill="none" x1="30" y1="372" x2="438" y2="372" stroke-width="1.4"></line>

        
        <rect fill="none" stroke="#3f5c4b" stroke-width="1.2" stroke-dasharray="4 3" x="486" y="76" width="150" height="256" rx="3"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="561" y="118" text-anchor="middle">CHILLED WATER</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="561" y="134" text-anchor="middle">PLANT</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="561" y="164" text-anchor="middle">chillers, pumps,</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="561" y="178" text-anchor="middle">cooling towers,</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="561" y="192" text-anchor="middle">dry coolers</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="561" y="240" text-anchor="middle">usually OUTSIDE</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="561" y="254" text-anchor="middle">wall-inward scope</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="561" y="284" text-anchor="middle">≈ $450k / MW</text>

        <line stroke="#4fc7d4" fill="none" x1="636" y1="204" x2="694" y2="204" stroke-width="2" marker-end="url(#a-12707F)"></line>
        <rect fill="none" stroke="#3f5c4b" stroke-width="1.2" stroke-dasharray="4 3" x="700" y="166" width="110" height="76" rx="3"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="755" y="200" text-anchor="middle">ATMOSPHERE</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="755" y="218" text-anchor="middle">heat finally leaves</text>

        
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="836" y="60" width="150" height="292" rx="3"></rect>
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#dce7df" font-weight="600" x="911" y="86" text-anchor="middle">WHY IT MATTERS</text>
        <line stroke="#3f5c4b" fill="none" x1="852" y1="96" x2="970" y2="96" stroke-width="1"></line>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="852" y="122">Higher supply water</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="852" y="136">temperature means</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="852" y="150">more free-cooling</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="852" y="164">hours and less</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="852" y="178">chiller runtime.</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#4fc7d4" x="852" y="208">Liquid runs warm.</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#4fc7d4" x="852" y="222">Air cannot.</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="852" y="252">That is the whole</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="852" y="266">efficiency argument,</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="852" y="280">and why liquid lowers</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="852" y="294">PUE rather than just</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="852" y="308">enabling density.</text>
      </svg>
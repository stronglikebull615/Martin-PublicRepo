<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" aria-label="Route to market diagram showing that about 55 percent of revenue is booked directly with Equinix while 45 percent is specified by Equinix but purchased through an EPC or contractor, alongside a map of the four stakeholder groups and what each owns."><defs><marker id="a-A65F0B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3dcd58"></path></marker><marker id="a-BFC6C0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f5c4b"></path></marker></defs><title>Route to market: direct versus EPC</title>
        
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#dce7df" font-weight="600" x="16" y="20">ROUTE TO MARKET</text>
        <rect fill="#123521" stroke="#3dcd58" stroke-width="1.3" x="16" y="34" width="120" height="90" rx="3"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#3dcd58" font-weight="600" x="76" y="72" text-anchor="middle">SCHNEIDER</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="76" y="90" text-anchor="middle">you</text>

        <path stroke="#3dcd58" fill="none" d="M136 62 L250 62" stroke-width="3" marker-end="url(#a-A65F0B)"></path>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#3dcd58" font-weight="500" x="193" y="54" text-anchor="middle">55% booked direct</text>

        <path stroke="#3dcd58" fill="none" d="M136 98 L200 98 L200 158 L250 158" stroke-width="2.2" marker-end="url(#a-A65F0B)"></path>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="310" y="202" text-anchor="middle">45% specified by Equinix,</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="310" y="216" text-anchor="middle">bought through a third party</text>

        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="250" y="36" width="120" height="52" rx="3"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="310" y="60" text-anchor="middle">EQUINIX</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="310" y="76" text-anchor="middle">global sourcing</text>

        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="250" y="132" width="120" height="52" rx="3"></rect>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" font-weight="600" x="310" y="156" text-anchor="middle">EPC /</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="310" y="172" text-anchor="middle">CONTRACTOR</text>
        <path stroke="#3f5c4b" fill="none" d="M310 132 L310 92" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a-BFC6C0)"></path>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="318" y="114">contracted by</text>

        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#dce7df" font-weight="600" x="16" y="228">THE FOUR DOORS — and what each one owns</text>
        <line stroke="#3f5c4b" fill="none" x1="16" y1="238" x2="440" y2="238" stroke-width="1"></line>
        <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398">
          <text x="16" y="258">Design engineering</text><text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="170" y="258">→ owns the standard</text>
          <text x="16" y="274">Global sourcing</text><text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="170" y="274">→ owns the contract</text>
          <text x="16" y="290">Regional construction</text><text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="170" y="290">→ owns the schedule</text>
        </g>

        
        <rect fill="#0c1a11" stroke="#dce7df" stroke-width="1.3" x="470" y="34" width="454" height="248" rx="3"></rect>
        <text font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" fill="#dce7df" font-weight="600" x="492" y="60">THE ONE THAT SURPRISES PEOPLE</text>
        <line stroke="#3f5c4b" fill="none" x1="492" y1="70" x2="902" y2="70" stroke-width="1"></line>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#dce7df" x="492" y="96">Operations owns the veto.</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="492" y="124">They did not select the equipment, they do not hold</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="492" y="140">the budget, and they cannot sign a contract. But they</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="492" y="156">live with the kit for fifteen years, they are the ones</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="492" y="172">called at 3am, and a bad service experience in one</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8fa398" x="492" y="188">region will quietly end you in all of them.</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#3dcd58" x="492" y="220">Deals die at design engineering and at operations.</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#3dcd58" x="492" y="236">They are rarely lost in procurement — by then the</text>
        <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#3dcd58" x="492" y="252">outcome was already set.</text>
      </svg>